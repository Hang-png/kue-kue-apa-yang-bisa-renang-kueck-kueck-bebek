<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>congrat repeat year</title>
  <!-- Font & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(145deg, #fdeff2 0%, #fff3e6 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(circle at 20% 30%, rgba(255, 220, 200, 0.4) 0%, transparent 30%),
                        radial-gradient(circle at 90% 70%, rgba(255, 200, 220, 0.3) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    .app-container {
      width: 100%;
      max-width: 650px;
      background: rgba(255, 250, 245, 0.7);
      backdrop-filter: blur(6px);
      border-radius: 60px 60px 40px 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 220, 190, 0.5) inset;
      padding: 30px 20px 40px;
      position: relative;
      z-index: 10;
      transition: all 0.3s ease;
      text-align: center;
    }

    .app-container::after {
      content: '🎂';
      position: absolute;
      top: -15px;
      right: 25px;
      font-size: 2.5rem;
      filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.1));
      z-index: 5;
    }

    h1 {
      font-weight: 600;
      font-size: 2.2rem;
      color: #6b4f3c;
      letter-spacing: -0.5px;
      margin-bottom: 0.5rem;
      text-shadow: 2px 2px 8px rgba(255, 210, 180, 0.5);
    }

    .subtitle {
      color: #9b7b6b;
      font-weight: 500;
      margin-bottom: 25px;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .cake-area {
      position: relative;
      width: 100%;
      height: 260px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .cake-graphics {
      position: relative;
      width: 180px;
      height: 200px;
    }

    .cake-layer-bottom {
      position: absolute;
      bottom: 20px;
      left: 10px;
      width: 160px;
      height: 70px;
      background: #f9c6b3;
      border-radius: 30px 30px 15px 15px;
      box-shadow: 0 8px 0 #e6a68f, 0 12px 18px rgba(0,0,0,0.1);
      border: 2px solid #f5b397;
    }

    .cake-layer-middle {
      position: absolute;
      bottom: 75px;
      left: 28px;
      width: 125px;
      height: 55px;
      background: #ffe1c6;
      border-radius: 25px 25px 15px 15px;
      box-shadow: 0 6px 0 #e5b594, 0 10px 14px rgba(0,0,0,0.08);
      border: 2px solid #fcd7b0;
    }

    .cake-layer-top {
      position: absolute;
      bottom: 120px;
      left: 48px;
      width: 85px;
      height: 45px;
      background: #fff4e0;
      border-radius: 20px 20px 12px 12px;
      box-shadow: 0 4px 0 #e0b891, 0 8px 12px rgba(0,0,0,0.06);
      border: 2px solid #ffe0bf;
    }

    .candles {
      position: absolute;
      bottom: 160px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 20;
    }

    .candle {
      width: 16px;
      height: 45px;
      background: #ff9e9e;
      border-radius: 8px 8px 4px 4px;
      position: relative;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      border: 1px solid #ff8a8a;
      transition: background 0.3s;
    }

    .candle::after {
      content: '';
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 14px;
      background: #6b4f3c;
      border-radius: 2px;
      z-index: 5;
    }

    .flame {
      position: absolute;
      top: -26px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 22px;
      background: radial-gradient(circle, #ffd966 0%, #ffb347 70%, #ff8c42 100%);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      box-shadow: 0 0 15px 5px rgba(255, 180, 60, 0.7);
      animation: flicker 0.9s infinite alternate;
      z-index: 10;
      transform-origin: center bottom;
      transition: all 0.3s ease;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1) rotate(-1deg); }
      100% { transform: translateX(-50%) scale(1.1) rotate(1deg); }
    }

    .flame.out {
      opacity: 0;
      transform: translateX(-50%) scale(0);
      animation: none;
      box-shadow: none;
    }

    .interactive-options {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin: 20px 0 10px;
      flex-wrap: wrap;
    }

    .btn-mic, .btn-click {
      background: #fff6ef;
      border: 2px solid #f3cdb5;
      color: #6b4f3c;
      font-weight: 600;
      padding: 12px 22px;
      border-radius: 40px;
      font-size: 1rem;
      box-shadow: 0 8px 14px rgba(0,0,0,0.05);
      cursor: pointer;
      transition: all 0.25s;
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(4px);
    }

    .btn-mic:hover, .btn-click:hover {
      background: #ffe8da;
      transform: translateY(-3px);
      box-shadow: 0 14px 18px rgba(0,0,0,0.08);
    }

    .btn-mic:active, .btn-click:active {
      transform: scale(0.96);
    }

    .mic-status {
      font-size: 0.85rem;
      color: #b48c7a;
    }

    .giftbox-area {
      min-height: 130px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.5s ease;
    }

    .giftbox {
      background: #ffdbb5;
      width: 120px;
      height: 90px;
      border-radius: 12px 12px 8px 8px;
      position: relative;
      box-shadow: 0 12px 15px rgba(0,0,0,0.15);
      cursor: pointer;
      transition: transform 0.25s;
      margin-top: 10px;
      border: 2px solid #f0ba8a;
      animation: float 3s ease-in-out infinite;
    }

    .giftbox:hover {
      transform: scale(1.04);
    }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    .giftbox::before {
      content: '';
      position: absolute;
      top: -10px;
      left: 10px;
      width: 100px;
      height: 18px;
      background: #f8cba1;
      border-radius: 5px;
      border: 2px solid #eeb083;
      box-shadow: 0 3px 4px rgba(0,0,0,0.1);
    }

    .giftbox::after {
      content: '🎀';
      position: absolute;
      top: -32px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2rem;
      filter: drop-shadow(0 4px 3px rgba(0,0,0,0.2));
    }

    .giftbox p {
      position: absolute;
      bottom: -32px;
      left: 50%;
      transform: translateX(-50%);
      color: #a07b62;
      font-weight: 600;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    /* ===== MODAL / POPUP STYLES ===== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: linear-gradient(145deg, #fffaf5, #fff0e6);
      border-radius: 30px;
      padding: 30px 25px;
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 25px 60px rgba(0,0,0,0.3), 0 0 0 2px #ffe0cc inset;
      animation: slideUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @keyframes slideUp {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #fff0e6;
      border: 2px solid #f3cdb5;
      color: #6b4f3c;
      font-size: 1.5rem;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .modal-close:hover {
      background: #ffdbb5;
      transform: rotate(90deg);
    }

    .modal-title {
      font-size: 1.8rem;
      color: #6b4f3c;
      margin-bottom: 25px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* Giftbox Modal khusus */
    .giftbox-modal .giftbox-large {
      width: 200px;
      height: 150px;
      background: #ffdbb5;
      border-radius: 20px 20px 15px 15px;
      position: relative;
      margin: 20px auto;
      cursor: pointer;
      box-shadow: 0 15px 25px rgba(0,0,0,0.2);
      border: 3px solid #f0ba8a;
      transition: all 0.3s;
      animation: float 3s ease-in-out infinite;
    }

    .giftbox-modal .giftbox-large::before {
      content: '';
      position: absolute;
      top: -15px;
      left: 15px;
      width: 170px;
      height: 25px;
      background: #f8cba1;
      border-radius: 8px;
      border: 3px solid #eeb083;
    }

    .giftbox-modal .giftbox-large::after {
      content: '🎀';
      position: absolute;
      top: -45px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 3rem;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    }

    .giftbox-modal .giftbox-large:hover {
      transform: scale(1.05);
    }

    .giftbox-modal .giftbox-large:active {
      animation: shake 0.5s;
    }

    @keyframes shake {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-5deg); }
      75% { transform: rotate(5deg); }
    }

    .giftbox-modal p {
      color: #a07b62;
      font-weight: 600;
      margin-top: 15px;
      font-size: 1.1rem;
    }

    /* Photostack Modal */
    .photostack-modal .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .photo-card {
      background: #fffcf6;
      border-radius: 20px;
      box-shadow: 0 15px 25px -8px rgba(0,0,0,0.2), 0 0 0 2px #ffe0cc inset;
      padding: 12px;
      transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .photo-card:hover {
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 20px 35px -8px rgba(0,0,0,0.3);
    }

    .photo-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 15px;
      background: #fde6d8;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: transform 0.3s;
    }

    .photo-card:hover img {
      transform: scale(1.05);
    }

    .photo-card .message {
      margin-top: 12px;
      font-weight: 600;
      color: #6b4f3c;
      background: #fff3ea;
      padding: 10px;
      border-radius: 15px;
      font-size: 0.95rem;
      width: 100%;
      text-align: center;
      transition: all 0.3s;
    }

    .photo-card:hover .message {
      background: #ffe8da;
      transform: scale(1.05);
    }

    /* ===== LIGHTBOX STYLES ===== */
    .lightbox-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.3s ease;
      cursor: zoom-out;
    }

    .lightbox-content {
      max-width: 90%;
      max-height: 90vh;
      position: relative;
      animation: zoomIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @keyframes zoomIn {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .lightbox-content img {
      width: 100%;
      height: auto;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    }

    .lightbox-close {
      position: fixed;
      top: 20px;
      right: 30px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #fff;
      color: #333;
      font-size: 2rem;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3001;
    }

    .lightbox-close:hover {
      background: #ffdbb5;
      transform: rotate(90deg) scale(1.1);
    }

    .lightbox-caption {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.9);
      padding: 15px 25px;
      border-radius: 20px;
      color: #6b4f3c;
      font-weight: 600;
      font-size: 1.1rem;
      z-index: 3002;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .confetti-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2000;
      overflow: hidden;
    }

    .confetti {
      position: absolute;
      width: 12px;
      height: 12px;
      background: #ffd166;
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      animation: confettiFall 3s linear forwards;
    }

    @keyframes confettiFall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    .music-indicator {
      font-size: 0.8rem;
      margin: 5px 0;
      color: #b48c7a;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 480px) {
      .cake-graphics {
        transform: scale(0.8);
        transform-origin: bottom center;
      }
      .cake-area {
        height: 200px;
      }
      .modal-content {
        padding: 20px 15px;
      }
      .photo-card img {
        height: 140px;
      }
      .giftbox-modal .giftbox-large {
        width: 150px;
        height: 120px;
      }
      .giftbox-modal .giftbox-large::before {
        width: 120px;
      }
      .lightbox-close {
        top: 15px;
        right: 15px;
        width: 40px;
        height: 40px;
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="app-container" id="appContainer">
    <h1>🎉 congrat repeat year 🎉</h1>
    <div class="subtitle">
      <span>HBD kids</span>
    </div>

    <!-- area kue & lilin -->
    <div class="cake-area" id="cakeArea" title="Klik lilin atau tiup (mikrofon)">
      <div class="cake-graphics">
        <div class="cake-layer-bottom"></div>
        <div class="cake-layer-middle"></div>
        <div class="cake-layer-top"></div>
        <div class="candles" id="candlesContainer">
          <div class="candle" data-candle="1"><div class="flame" id="flame1"></div></div>
          <div class="candle" data-candle="2"><div class="flame" id="flame2"></div></div>
          <div class="candle" data-candle="3"><div class="flame" id="flame3"></div></div>
        </div>
      </div>
    </div>

    <!-- opsi interaktif -->
    <div class="interactive-options">
      <button class="btn-mic" id="micBtn" title="Gunakan mikrofon untuk meniup lilin">
        <i class="fas fa-microphone"></i> Tiup Mikrofon
      </button>
      <button class="btn-click" id="clickBlowBtn" title="Klik untuk padamkan lilin">
        <i class="fas fa-hand-pointer"></i> Klik Lilin
      </button>
    </div>
    <div class="mic-status" id="micStatus">🔇 mikrofon nonaktif (klik untuk aktif)</div>

    <!-- indikator kado muncul -->
    <div class="giftbox-area" id="giftboxArea">
      <div class="giftbox hidden" id="giftbox" title="Klik untuk membuka kado">
        <p>Klik untuk membuka </p>
      </div>
    </div>

    <div class="music-indicator" id="musicIndicator">
      <i class="fas fa-music"></i> musik: marry crismast
    </div>
  </div>

  <!-- Modal Popup untuk Giftbox -->
  <div class="modal-overlay hidden" id="giftboxModal">
    <div class="modal-content giftbox-modal">
      <button class="modal-close" id="closeGiftboxModal">&times;</button>
      <div class="modal-title"> Kado Spesial! </div>
      <div class="giftbox-large" id="giftboxLarge" title="Klik untuk membuka kado besar">
        <p style="position: absolute; bottom: -40px; left: 50%; transform: translateX(-50%);">Klik untuk buka!</p>
      </div>
      <p style="margin-top: 50px;"> tebak isi dalamnya :> </p>
    </div>
  </div>

<!-- Modal Popup untuk Photostack -->
<div class="modal-overlay hidden" id="photoModal">
  <div class="modal-content photostack-modal">
    <button class="modal-close" id="closePhotoModal">&times;</button>
    <div class="modal-title">📸 Momen-Momen mu 📸</div>
    <div class="photo-grid">
      <div class="photo-card" data-image="foto1.jpg" data-caption="awokawoawko 😆">
        <img src="foto1.jpg" alt="foto lucu 1" draggable="false">
        <div class="message">awokawoawko 😆</div>
      </div>
      <div class="photo-card" data-image="foto2.jpg" data-caption="kapan nyusul sama cio">
        <img src="foto2.jpg" alt="foto lucu 2" draggable="false">
        <div class="message">kapan nyusul sama cio</div>
      </div>
      <div class="photo-card" data-image="foto3.jpg" data-caption="semangat kakak ilustrator wkwk">
        <img src="foto3.jpg" alt="foto lucu 3" draggable="false">
        <div class="message">semangat kakak ilustrator wkwk</div>
      </div>
    </div>
  </div>
</div>

  <!-- Lightbox untuk foto besar -->
  <div class="lightbox-overlay hidden" id="lightboxOverlay">
    <button class="lightbox-close" id="lightboxClose">&times;</button>
    <div class="lightbox-content">
      <img src="" alt="Foto besar" id="lightboxImage">
    </div>
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>

  <!-- konfeti container -->
  <div class="confetti-container" id="confettiContainer"></div>

  <script>
    (function(){
      // elemen
      const flames = document.querySelectorAll('.flame');
      const micBtn = document.getElementById('micBtn');
      const clickBlowBtn = document.getElementById('clickBlowBtn');
      const micStatus = document.getElementById('micStatus');
      const giftbox = document.getElementById('giftbox');
      const giftboxArea = document.getElementById('giftboxArea');
      const cakeArea = document.getElementById('cakeArea');
      const confettiContainer = document.getElementById('confettiContainer');
      
      // modal elements
      const giftboxModal = document.getElementById('giftboxModal');
      const photoModal = document.getElementById('photoModal');
      const closeGiftboxModal = document.getElementById('closeGiftboxModal');
      const closePhotoModal = document.getElementById('closePhotoModal');
      const giftboxLarge = document.getElementById('giftboxLarge');
      
      // lightbox elements
      const lightboxOverlay = document.getElementById('lightboxOverlay');
      const lightboxImage = document.getElementById('lightboxImage');
      const lightboxCaption = document.getElementById('lightboxCaption');
      const lightboxClose = document.getElementById('lightboxClose');

      let isCakeBlown = false;
      let micActive = false;
      let audioCtx = null;
      let analyser = null;
      let dataArray = null;
      let mediaStream = null;
      let audioElement = null;
      
      // ====== MUSIK LOKAL ======
      const musicUrl = 'mis-u.mp3'; // <-- LOKAL FILE
      
      function playMusic() {
        if (!audioElement) {
          audioElement = new Audio(musicUrl);
          audioElement.loop = true;
          audioElement.volume = 0.6;
        }
        audioElement.play().catch(err => {
          console.log('Gagal memutar musik lokal:', err);
        });
      }

      // fungsi mematikan lilin
      function blowOutCandles() {
        if (isCakeBlown) return;
        isCakeBlown = true;
        flames.forEach(flame => {
          flame.classList.add('out');
        });
        giftbox.classList.remove('hidden');
        generateConfetti();
        playMusic();
        micStatus.textContent = 'Kotak Mistery';
      }

      // event klik area kue
      cakeArea.addEventListener('click', (e) => {
        if (isCakeBlown) return;
        if (e.target.closest('.candle') || e.target.closest('.cake-graphics') || e.target.closest('.flame')) {
          blowOutCandles();
        }
      });

      // tombol klik manual
      clickBlowBtn.addEventListener('click', () => {
        if (!isCakeBlown) blowOutCandles();
      });

      // mikrofon
      micBtn.addEventListener('click', async () => {
        if (isCakeBlown) return;
        if (!micActive) {
          try {
            mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            const source = audioCtx.createMediaStreamSource(mediaStream);
            source.connect(analyser);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            micActive = true;
            micBtn.innerHTML = '<i class="fas fa-microphone"></i> Tiup sekarang!';
            micStatus.textContent = '🎤 mikrofon aktif — tiup kencang ke arah kue';
            detectBlow();
          } catch (err) {
            alert('Izin mikrofon ditolak, gunakan klik lilin ya.');
            micStatus.textContent = '⚠️ mikrofon tidak diizinkan';
          }
        } else {
          if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
          }
          if (audioCtx) audioCtx.close();
          micActive = false;
          micBtn.innerHTML = '<i class="fas fa-microphone"></i> Tiup Mikrofon';
          micStatus.textContent = '🔇 mikrofon nonaktif';
        }
      });

      function detectBlow() {
        if (!micActive || isCakeBlown) return;
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) {
          sum += dataArray[i];
        }
        const average = sum / dataArray.length;
        if (average > 40) {
          blowOutCandles();
          if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
          }
          if (audioCtx) audioCtx.close();
          micActive = false;
          micBtn.innerHTML = '<i class="fas fa-microphone"></i> Tiup Mikrofon';
          micStatus.textContent = '🎉 berhasil tiup! lilin padam';
        } else {
          requestAnimationFrame(detectBlow);
        }
      }

      // ====== MODAL FUNCTIONS ======
      // Buka modal giftbox
      function openGiftboxModal() {
        giftboxModal.classList.remove('hidden');
        generateConfetti(30);
      }

      // Tutup modal giftbox
      function closeGiftboxModalFunc() {
        giftboxModal.classList.add('hidden');
      }

      // Buka modal photo
      function openPhotoModal() {
        photoModal.classList.remove('hidden');
        generateConfetti(50);
      }

      // Tutup modal photo
      function closePhotoModalFunc() {
        photoModal.classList.add('hidden');
      }

      // Event listeners untuk modal
      closeGiftboxModal.addEventListener('click', closeGiftboxModalFunc);
      closePhotoModal.addEventListener('click', closePhotoModalFunc);

      // Klik overlay untuk tutup modal
      giftboxModal.addEventListener('click', (e) => {
        if (e.target === giftboxModal) {
          closeGiftboxModalFunc();
        }
      });

      photoModal.addEventListener('click', (e) => {
        if (e.target === photoModal) {
          closePhotoModalFunc();
        }
      });

      // ====== GIFTBOX INTERACTIONS ======
      // Klik giftbox kecil (di area utama)
      giftbox.addEventListener('click', () => {
        if (!isCakeBlown) return;
        giftbox.classList.add('hidden');
        openGiftboxModal();
      });

      // Klik giftbox besar (di dalam modal)
      giftboxLarge.addEventListener('click', () => {
        closeGiftboxModalFunc();
        setTimeout(() => {
          openPhotoModal();
        }, 300);
      });

      // Keyboard support untuk giftbox
      giftbox.setAttribute('tabindex', '0');
      giftbox.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !giftbox.classList.contains('hidden')) {
          giftbox.click();
        }
      });

      giftboxLarge.setAttribute('tabindex', '0');
      giftboxLarge.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          giftboxLarge.click();
        }
      });

      // ====== LIGHTBOX FUNCTIONS ======
      function openLightbox(imageSrc, caption) {
        lightboxImage.src = imageSrc;
        lightboxCaption.textContent = caption;
        lightboxOverlay.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        lightboxOverlay.classList.add('hidden');
        document.body.style.overflow = 'auto';
      }

      // Event listener untuk foto cards
      const photoCards = document.querySelectorAll('.photo-card');
      photoCards.forEach(card => {
        card.addEventListener('click', () => {
          const imageSrc = card.getAttribute('data-image');
          const caption = card.getAttribute('data-caption');
          openLightbox(imageSrc, caption);
        });
      });

      // Close lightbox
      lightboxClose.addEventListener('click', closeLightbox);
      
      lightboxOverlay.addEventListener('click', (e) => {
        if (e.target === lightboxOverlay || e.target === lightboxImage) {
          closeLightbox();
        }
      });

      // ====== KONFETI ======
      function generateConfetti(count = 60) {
        for (let i = 0; i < count; i++) {
          const confetti = document.createElement('div');
          confetti.classList.add('confetti');
          confetti.style.left = Math.random() * 100 + '%';
          confetti.style.background = ['#ffd166', '#f08080', '#f9c6b3', '#a0c4ff', '#ffb3c6', '#c1e1c1'][Math.floor(Math.random()*6)];
          confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
          confetti.style.width = (Math.random() * 10 + 6) + 'px';
          confetti.style.height = (Math.random() * 10 + 6) + 'px';
          confettiContainer.appendChild(confetti);
          setTimeout(() => confetti.remove(), 3500);
        }
      }

      // Escape key untuk tutup semua modal
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (!lightboxOverlay.classList.contains('hidden')) {
            closeLightbox();
          } else if (!giftboxModal.classList.contains('hidden')) {
            closeGiftboxModalFunc();
          } else if (!photoModal.classList.contains('hidden')) {
            closePhotoModalFunc();
          }
        }
      });
    })();
  </script>
</body>
</html>
