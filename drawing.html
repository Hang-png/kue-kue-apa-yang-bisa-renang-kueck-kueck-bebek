<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>🎨 Free Drawing Board</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(145deg, #e8f4f8 0%, #fff3e6 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      position: relative;
    }
    .drawing-header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 15px;
    }
    .drawing-title {
      font-size: 2rem;
      font-weight: 700;
      color: #6b4f3c;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #fff6ef;
      border: 2px solid #f3cdb5;
      color: #6b4f3c;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 40px;
      text-decoration: none;
      transition: all 0.25s;
      font-size: 0.95rem;
    }
    .btn-back:hover {
      background: #ffe8da;
      transform: translateY(-2px);
      box-shadow: 0 8px 15px rgba(0,0,0,0.08);
    }
    .canvas-container {
      width: 100%;
      max-width: 900px;
      background: white;
      border-radius: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1), 0 0 0 2px #ffe0cc inset;
      padding: 20px;
      margin-bottom: 20px;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 20px;
      background: #fffaf5;
      cursor: crosshair;
      border: 2px solid #f3cdb5;
      touch-action: none;
    }
    .toolbar {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
      align-items: center;
    }
    .tool-btn {
      background: #fff6ef;
      border: 2px solid #f3cdb5;
      color: #6b4f3c;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.25s;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-family: 'Quicksand', sans-serif;
    }
    .tool-btn:hover {
      background: #ffe8da;
      transform: translateY(-2px);
      box-shadow: 0 8px 15px rgba(0,0,0,0.08);
    }
    .tool-btn.active {
      background: #ffdbb5;
      border-color: #f0ba8a;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .tool-btn.ig-btn {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      color: white;
      border: 2px solid #bc1888;
      font-weight: 700;
    }
    .tool-btn.ig-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 12px 25px rgba(188,24,136,0.4);
    }
    .color-picker {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid #f3cdb5;
      cursor: pointer;
      padding: 0;
      overflow: hidden;
    }
    .color-picker::-webkit-color-swatch-wrapper { padding: 0; }
    .color-picker::-webkit-color-swatch { border: none; border-radius: 50%; }
    .size-slider {
      width: 100px;
      accent-color: #f08080;
      cursor: pointer;
    }
    .size-label {
      font-size: 0.85rem;
      color: #9b7b6b;
      font-weight: 600;
    }
    .name-input {
      background: #fffaf5;
      border: 2px solid #f3cdb5;
      border-radius: 30px;
      padding: 10px 18px;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: #6b4f3c;
      outline: none;
      width: 180px;
      transition: all 0.25s;
    }
    .name-input:focus {
      border-color: #f08080;
      box-shadow: 0 0 0 3px rgba(240,128,128,0.2);
    }
    .name-input::placeholder { color: #c4a992; }
    
    /* Modal IG Share */
    .ig-modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .ig-modal-content {
      background: linear-gradient(145deg, #fffaf5, #fff0e6);
      border-radius: 30px;
      padding: 30px 25px;
      max-width: 450px;
      width: 100%;
      position: relative;
      box-shadow: 0 25px 60px rgba(0,0,0,0.3);
      animation: slideUp 0.5s cubic-bezier(0.2,0.8,0.2,1);
      text-align: center;
    }
    @keyframes slideUp {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .ig-icon {
      font-size: 4rem;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 15px;
    }
    .ig-modal-title {
      font-size: 1.5rem;
      color: #6b4f3c;
      margin-bottom: 10px;
      font-weight: 700;
    }
    .ig-modal-desc {
      font-size: 0.95rem;
      color: #9b7b6b;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .ig-username {
      background: #fff3ea;
      padding: 12px 20px;
      border-radius: 15px;
      font-weight: 700;
      color: #bc1888;
      font-size: 1.1rem;
      margin-bottom: 20px;
      display: inline-block;
      border: 2px dashed #ffb3c6;
    }
    .ig-preview {
      width: 100%;
      max-height: 200px;
      object-fit: contain;
      border-radius: 15px;
      background: #fffaf5;
      border: 2px solid #f3cdb5;
      margin-bottom: 20px;
    }
    .ig-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .ig-btn-primary {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      color: white;
      border: none;
      padding: 15px 25px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Quicksand', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 20px rgba(188,24,136,0.3);
    }
    .ig-btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(188,24,136,0.4);
    }
    .ig-btn-secondary {
      background: #fff6ef;
      color: #6b4f3c;
      border: 2px solid #f3cdb5;
      padding: 12px 25px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.25s;
      font-family: 'Quicksand', sans-serif;
    }
    .ig-btn-secondary:hover {
      background: #ffe8da;
      transform: translateY(-2px);
    }
    .ig-close {
      position: absolute;
      top: 15px;
      right: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #fff0e6;
      border: 2px solid #f3cdb5;
      color: #6b4f3c;
      font-size: 1.5rem;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ig-close:hover {
      background: #ffdbb5;
      transform: rotate(90deg);
    }
    .steps {
      text-align: left;
      background: #fffaf5;
      padding: 15px 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      border: 2px dashed #f3cdb5;
    }
    .steps-title {
      font-weight: 700;
      color: #6b4f3c;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }
    .steps ol {
      padding-left: 20px;
      color: #9b7b6b;
      font-size: 0.85rem;
      line-height: 1.7;
    }
    .steps ol li {
      margin-bottom: 5px;
    }
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #4caf50;
      color: white;
      padding: 15px 25px;
      border-radius: 15px;
      font-weight: 600;
      font-size: 0.95rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      z-index: 9999;
      animation: slideIn 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .hidden { display: none !important; }
    @media (max-width: 600px) {
      .drawing-title { font-size: 1.5rem; }
      .toolbar { gap: 6px; }
      .tool-btn { padding: 8px 12px; font-size: 0.8rem; }
      .name-input { width: 130px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <div class="drawing-header">
    <div class="drawing-title">
      <i class="fas fa-paint-brush" style="color: #f08080;"></i>
      Free Drawing Board
    </div>
    <a href="index.html" class="btn-back">
      <i class="fas fa-arrow-left"></i> Kembali
    </a>
  </div>

  <div class="canvas-container">
    <canvas id="drawingCanvas"></canvas>
  </div>

  <div class="toolbar">
    <input type="color" id="colorPicker" class="color-picker" value="#6b4f3c" title="Pilih warna">
    
    <label class="size-label">
      <i class="fas fa-circle" style="font-size: 0.7rem;"></i>
      Ukuran:
    </label>
    <input type="range" id="sizeSlider" class="size-slider" min="1" max="30" value="5">
    <span class="size-label" id="sizeDisplay">5px</span>

    <button class="tool-btn" id="btnEraser" title="Hapus">
      <i class="fas fa-eraser"></i> Penghapus
    </button>

    <button class="tool-btn" id="btnClear" title="Bersihkan kanvas">
      <i class="fas fa-trash"></i> Bersihkan
    </button>

    <button class="tool-btn" id="btnUndo" title="Undo">
      <i class="fas fa-undo"></i> Undo
    </button>

    <input type="text" class="name-input" id="nameInput" placeholder="Nama kamu..." maxlength="30">

    <!-- Tombol Share ke Instagram -->
    <button class="tool-btn ig-btn" id="btnShareIG" title="Kirim gambar ke Instagram aku">
      <i class="fab fa-instagram"></i> Share ke IG
    </button>
  </div>

  <!-- Modal Share IG -->
  <div class="ig-modal-overlay hidden" id="igModal">
    <div class="ig-modal-content">
      <button class="ig-close" id="closeIgModal">&times;</button>
      <div class="ig-icon">
        <i class="fab fa-instagram"></i>
      </div>
      <div class="ig-modal-title">Kirim ke Instagram</div>
      <div class="ig-modal-desc">Gambar kamu akan dikirim ke akun Instagram aku</div>
      
      <!-- GANTI USERNAME IG KAMU DI SINI -->
      <div class="ig-username">@hng_woy</div>
      
      <img id="igPreview" class="ig-preview" src="" alt="Preview gambar">
      
      <div class="steps">
        <div class="steps-title">📝 Cara Kirim:</div>
        <ol>
          <li>Klik tombol <b>Download & Buka IG</b> di bawah</li>
          <li>Gambar akan otomatis ke-download</li>
          <li>Instagram akan terbuka di tab baru</li>
          <li>Kirim gambar via <b>DM ke @hng_woy</b></li>
        </ol>
      </div>
      
      <div class="ig-actions">
        <button class="ig-btn-primary" id="btnDownloadAndOpen">
          <i class="fas fa-download"></i> Download & Buka IG
        </button>
        <button class="ig-btn-secondary" id="btnCancelIg">
          Batal
        </button>
      </div>
    </div>
  </div>

  <script>
    (function(){
      // ====== GANTI USERNAME INSTAGRAM KAMU DI SINI ======
      const INSTAGRAM_USERNAME = 'hng_woy'; // <-- GANTI!
      
      const canvas = document.getElementById('drawingCanvas');
      const ctx = canvas.getContext('2d');
      
      function resizeCanvas() {
        const container = canvas.parentElement;
        const width = container.clientWidth - 4;
        const height = 400;
        canvas.width = width;
        canvas.height = height;
        ctx.fillStyle = '#fffaf5';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      let isDrawing = false;
      let lastX = 0;
      let lastY = 0;
      let currentColor = '#6b4f3c';
      let currentSize = 5;
      let isEraser = false;
      let undoStack = [];
      let maxUndo = 20;

      const colorPicker = document.getElementById('colorPicker');
      const sizeSlider = document.getElementById('sizeSlider');
      const sizeDisplay = document.getElementById('sizeDisplay');
      const btnEraser = document.getElementById('btnEraser');
      const btnClear = document.getElementById('btnClear');
      const btnUndo = document.getElementById('btnUndo');
      const btnShareIG = document.getElementById('btnShareIG');
      const nameInput = document.getElementById('nameInput');
      
      // Modal elements
      const igModal = document.getElementById('igModal');
      const closeIgModal = document.getElementById('closeIgModal');
      const btnDownloadAndOpen = document.getElementById('btnDownloadAndOpen');
      const btnCancelIg = document.getElementById('btnCancelIg');
      const igPreview = document.getElementById('igPreview');

      ctx.fillStyle = '#fffaf5';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      saveState();

      colorPicker.addEventListener('input', (e) => {
        currentColor = e.target.value;
        if (isEraser) { isEraser = false; btnEraser.classList.remove('active'); }
      });

      sizeSlider.addEventListener('input', (e) => {
        currentSize = parseInt(e.target.value);
        sizeDisplay.textContent = currentSize + 'px';
      });

      btnEraser.addEventListener('click', () => {
        isEraser = !isEraser;
        btnEraser.classList.toggle('active');
      });

      btnClear.addEventListener('click', () => {
        if (confirm('Bersihkan kanvas?')) {
          ctx.fillStyle = '#fffaf5';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          saveState();
        }
      });

      btnUndo.addEventListener('click', undo);

      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        let clientX, clientY;
        if (e.touches) {
          clientX = e.touches[0].clientX;
          clientY = e.touches[0].clientY;
        } else {
          clientX = e.clientX;
          clientY = e.clientY;
        }
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY
        };
      }

      function startDrawing(e) {
        e.preventDefault();
        isDrawing = true;
        const pos = getPos(e);
        lastX = pos.x;
        lastY = pos.y;
      }

      function draw(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(pos.x, pos.y);
        ctx.strokeStyle = isEraser ? '#fffaf5' : currentColor;
        ctx.lineWidth = isEraser ? currentSize * 3 : currentSize;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
        lastX = pos.x;
        lastY = pos.y;
      }

      function stopDrawing() {
        if (isDrawing) {
          isDrawing = false;
          saveState();
        }
      }

      canvas.addEventListener('mousedown', startDrawing);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDrawing);
      canvas.addEventListener('mouseleave', stopDrawing);
      canvas.addEventListener('touchstart', startDrawing);
      canvas.addEventListener('touchmove', draw);
      canvas.addEventListener('touchend', stopDrawing);

      function saveState() {
        undoStack.push(canvas.toDataURL());
        if (undoStack.length > maxUndo) {
          undoStack.shift();
        }
      }

      function undo() {
        if (undoStack.length <= 1) return;
        undoStack.pop();
        const img = new Image();
        img.onload = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0);
        };
        img.src = undoStack[undoStack.length - 1];
      }

      // ====== SHARE KE INSTAGRAM ======
      function openIgModal() {
        // Set preview
        igPreview.src = canvas.toDataURL('image/png');
        igModal.classList.remove('hidden');
      }

      function closeIgModalFunc() {
        igModal.classList.add('hidden');
      }

      btnShareIG.addEventListener('click', openIgModal);
      closeIgModal.addEventListener('click', closeIgModalFunc);
      btnCancelIg.addEventListener('click', closeIgModalFunc);
      
      igModal.addEventListener('click', (e) => {
        if (e.target === igModal) closeIgModalFunc();
      });

      btnDownloadAndOpen.addEventListener('click', () => {
        // 1. Download gambar
        const dataURL = canvas.toDataURL('image/png');
        const name = nameInput.value.trim() || 'gambar';
        const filename = name.toLowerCase().replace(/\s+/g, '-') + '.png';
        
        const link = document.createElement('a');
        link.download = filename;
        link.href = dataURL;
        link.click();
        
        // Show notification
        showNotification('✅ Gambar ter-download! Buka IG untuk kirim...');
        
        // 2. Buka Instagram setelah delay singkat
        setTimeout(() => {
          window.open(`https://www.instagram.com/${hng_woy}/`, '_blank');
        }, 800);
        
        // 3. Close modal
        setTimeout(() => {
          closeIgModalFunc();
        }, 1500);
      });

      // ====== NOTIFICATION ======
      function showNotification(message) {
        const notif = document.createElement('div');
        notif.className = 'notification';
        notif.innerHTML = message;
        document.body.appendChild(notif);
        
        setTimeout(() => {
          notif.remove();
        }, 3500);
      }

      // Escape key
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !igModal.classList.contains('hidden')) {
          closeIgModalFunc();
        }
      });
    })();
  </script>
</body>
</html>
